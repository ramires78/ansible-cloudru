---
- name: Настроить Nginx для Java-приложения
  hosts: prod
  become: true

  tasks:
    - name: Установить Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true

    - name: Настроить перенаправление запросов на Tomcat
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/app42
        mode: "0644"
        content: |
          server {
              listen 80;
              server_name _;

              location /app42/ {
                  proxy_pass http://127.0.0.1:8080;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
      notify: Перезапустить Nginx

    - name: Включить сайт App42
      ansible.builtin.file:
        src: /etc/nginx/sites-available/app42
        dest: /etc/nginx/sites-enabled/app42
        state: link
      notify: Перезапустить Nginx

    - name: Отключить стандартный сайт
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Перезапустить Nginx

    - name: Проверить настройки Nginx
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Запустить Nginx и включить автозапуск
      ansible.builtin.systemd:
        name: nginx
        state: started
        enabled: true

  handlers:
    - name: Перезапустить Nginx
      ansible.builtin.systemd:
        name: nginx
        state: restarted
