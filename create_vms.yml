---
- name: Создание серверов и получение их IP в Cloud.ru
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    project_id: "bff05599-f09b-4436-be35-975d31d7d8ce"
    zone_id: "7c99a597-8516-494f-a2c7-d7377048681e"
    image_id: "fe51a6e6-a5ad-410e-b441-1a195208a8cf"
    disk_id: "a859e3dc-6b14-42a8-9bcc-890fde0ba6d0"
    security_group_id: "1dbf054b-9bfb-46d1-87d4-fc0327e388cc"

    servers:
      - name: ansible-build
        flavor: "5f71a5d8-073f-4eb8-b9b8-1499c7372819"

      - name: ansible-prod
        flavor: "139ddd16-2482-4694-991d-9b1834266e03"

  tasks:

    - name: Получить токен Cloud.ru
      ansible.builtin.uri:
        url: https://iam.api.cloud.ru/api/v1/auth/token
        method: POST
        body_format: json
        body:
          keyId: "{{ lookup('ini', 'CLOUDRU_KEY_ID type=properties file=/home/ramires/.config/cloudru/credentials') }}"
          secret: "{{ lookup('ini', 'CLOUDRU_KEY_SECRET type=properties file=/home/ramires/.config/cloudru/credentials') }}"
        status_code: 200
      register: auth
      no_log: true

    - name: Проверить существующие серверы
      ansible.builtin.uri:
        url: "https://compute.api.cloud.ru/api/v1/vms?project_id={{ project_id }}"
        method: GET
        headers:
          Authorization: "Bearer {{ auth.json.access_token }}"
        status_code: 200
      register: existing_vms
      no_log: true

    - name: Создать отсутствующие серверы
      ansible.builtin.uri:
        url: https://compute.api.cloud.ru/api/v1.1/vms
        method: POST
        headers:
          Authorization: "Bearer {{ auth.json.access_token }}"
        body_format: json
        body:
          - project_id: "{{ project_id }}"
            availability_zone_id: "{{ zone_id }}"
            name: "{{ item.name }}"
            flavor_id: "{{ item.flavor }}"
            image_id: "{{ image_id }}"

            interfaces:
              - type: direct_ip
                new_external_ip: true
                security_groups:
                  - "{{ security_group_id }}"

            disks:
              - name: "{{ item.name }}-disk"
                disk_type_id: "{{ disk_id }}"
                size: 15

            image_metadata:
              hostname: "{{ item.name }}"
              name: ramires
              public_key: "{{ lookup('file', '/home/ramires/.ssh/id_ed25519_ansible.pub') }}"

        status_code: 201

      loop: "{{ servers }}"
      loop_control:
        label: "{{ item.name }}"

      when: item.name not in (existing_vms.json['items'] | map(attribute='name') | list)
      register: created_vms
      no_log: true

    - name: Дождаться запуска серверов
      ansible.builtin.uri:
        url: "https://compute.api.cloud.ru/api/v1/vms?project_id={{ project_id }}"
        method: GET
        headers:
          Authorization: "Bearer {{ auth.json.access_token }}"
        status_code: 200
      register: vm_list
      until: >
        (
          vm_list.json['items']
          | selectattr('name', 'equalto', 'ansible-build')
          | selectattr('state', 'equalto', 'running')
          | list | length
        ) == 1
        and
        (
          vm_list.json['items']
          | selectattr('name', 'equalto', 'ansible-prod')
          | selectattr('state', 'equalto', 'running')
          | list | length
        ) == 1
      retries: 30
      delay: 10
      no_log: true

    - name: Получить IP сборочного и продового серверов
      ansible.builtin.set_fact:
        build_ip: "{{ (vm_list.json['items'] | selectattr('name', 'equalto', 'ansible-build') | first).interfaces[0].ip_address }}"
        prod_ip: "{{ (vm_list.json['items'] | selectattr('name', 'equalto', 'ansible-prod') | first).interfaces[0].ip_address }}"

    - name: Проверить полученные IP-адреса
      ansible.builtin.assert:
        that:
          - build_ip | length > 6
          - prod_ip | length > 6
        fail_msg: "Не удалось получить IP-адреса серверов"
        success_msg: "IP-адреса обоих серверов получены"

    - name: Автоматически создать inventory.ini
      ansible.builtin.copy:
        dest: "{{ playbook_dir }}/inventory.ini"
        mode: "0644"
        content: |
          [build]
          ansible-build ansible_host={{ build_ip }}

          [prod]
          ansible-prod ansible_host={{ prod_ip }}

          [all:vars]
          ansible_user=ramires
          ansible_ssh_private_key_file=/home/ramires/.ssh/id_ed25519_ansible
          ansible_python_interpreter=/usr/bin/python3

    - name: Показать адреса серверов
      ansible.builtin.debug:
        msg:
          - "Сборочный сервер: {{ build_ip }}"
          - "Продовый сервер: {{ prod_ip }}"
          - "Inventory создан автоматически"
